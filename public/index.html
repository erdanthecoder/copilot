
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KidLearn Classroom</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="app">
  <section id="onboard" class="screen glass hero">
    <div class="brand"><span class="orb"></span><div><h1>KidLearn Classroom</h1><p data-i="tagline">A bright, safe, high-tech classroom for Year 1–2.</p></div></div>
    <div class="language-pick"><button data-lang="en">English</button><button data-lang="ru">Русский</button></div>
    <div class="grid two">
      <label><span data-i="name">Name</span><input id="name" maxlength="30" placeholder="Learner name"></label>
      <label><span data-i="role">Role</span><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select></label>
      <label><span data-i="year">Year</span><select id="year"><option value="1">Year 1</option><option value="2">Year 2</option></select></label>
      <label><span data-i="pin">Teacher/Admin PIN</span><input id="pin" placeholder="only for teacher/admin"></label>
    </div>
    <div class="panel"><h3 data-i="avatar">Avatar chef lab</h3><div class="avatar-builder" id="avatarBuilder"></div></div>
    <div class="panel"><h3 data-i="background">Choose background</h3><div id="backgrounds" class="chips"></div></div>
    <button id="enter" class="primary" data-i="enter">Enter classroom</button>
  </section>
  <section id="classroom" class="screen hidden">
    <aside class="sidebar glass"><div class="mini-brand"><span class="orb"></span><b>KidLearn</b></div><nav><button data-page="dashboard" class="active" data-i="dash">Dashboard</button><button data-page="learn" data-i="learn">Learn</button><button data-page="games" data-i="games">Games</button><button data-page="worlds" data-i="worlds">World Islands</button><button data-page="homework" data-i="homework">Homework</button><button data-page="teacher" class="teacherOnly" data-i="teacher">Teacher</button><button data-page="settings" data-i="settings">Settings</button></nav><div id="meCard" class="me-card"></div></aside>
    <main><header class="topbar glass"><div><h2 id="pageTitle">Dashboard</h2><p id="todayLine"></p></div><div class="music"><button id="musicToggle">Music</button><select id="track"><option value="bright">Bright Classroom</option><option value="victory">Champions-style Original</option><option value="neon">Dai-Dai-style Original</option></select></div></header><section id="content" class="content"></section></main>
  </section>
</div>
<div id="effectLayer"></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
