name: Deploy to Firebase Hosting

# bandaworld.web.app is a second, shorter address for Banda World Islands (same files as banda-worldislands).
# Deploys learnkyrgyz.web.app, studentlrnkyrgyz.web.app and teachlrnkyrgyz.web.app.
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT (a service-account JSON key).
# The Firebase project ID is read from that key, and the student/teacher
# sites are created automatically if they don't exist yet.
on:
  push:
    branches: ["claude/erdan-offline-writing-app-7sgntw"]
  workflow_dispatch:

jobs:
  # World Islands for Windows: built on a real Windows machine (only when desktop/ changes), checked that it starts,
  # then published at world-islands.web.app/download/WorldIslands-Setup.exe by the deploy job below.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: desktop/dist/WorldIslands-Setup.exe
          key: desktop-${{ hashFiles('desktop/package.json', 'desktop/package-lock.json', 'desktop/main.js', 'desktop/offline.html', 'desktop/icon.png', 'desktop/build/**') }}
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - name: Build the installer
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
      - name: Check the app starts (and keeps running)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: desktop
        run: |
          $p = Start-Process -FilePath "dist\win-unpacked\World Islands.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "World Islands exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-FileHash dist\WorldIslands-Setup.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: desktop/dist/WorldIslands-Setup.exe
          retention-days: 5

  deploy:
    needs: desktop
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip (no Firebase secret yet)
        if: env.HAS_FIREBASE != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret is not set — skipping Firebase deploy."
      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE == 'true'
        with:
          node-version: 20
      - name: Build the three sites
        if: env.HAS_FIREBASE == 'true'
        run: ./scripts/build-firebase.sh
      - name: Get the Windows app
        if: env.HAS_FIREBASE == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: dist/banda/download
      - name: Checksum for the download page
        if: env.HAS_FIREBASE == 'true'
        run: |
          if [ -f dist/banda/download/WorldIslands-Setup.exe ]; then
            (cd dist/banda/download && sha256sum WorldIslands-Setup.exe | cut -d' ' -f1 > WorldIslands-Setup.sha256.txt && ls -la)
          else echo "::warning::No Windows app this time"; fi
      - name: Create sites (if needed) and deploy
        if: env.HAS_FIREBASE == 'true'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          echo "Firebase project: $PROJECT"
          npm i -g firebase-tools@14 >/dev/null
          for site in learnkyrgyz studentlrnkyrgyz teachlrnkyrgyz; do
            firebase hosting:sites:get "$site" --project "$PROJECT" >/dev/null 2>&1 \
              && echo "Site $site exists" \
              || firebase hosting:sites:create "$site" --project "$PROJECT" --non-interactive
          done
          # the4workspace.web.app (the one-account hub), plus oneintwo.web.app and
          # oneinfour.web.app (its old addresses, which now forward there). Site names are global, so each is allowed to fail
          # without stopping the LearnKyrgyz deploy.
          ONLY="hosting:home,hosting:student,hosting:teacher"
          for pair in hub:the4workspace oldhub:oneintwo oldhub2:oneinfour banda:banda-worldislands banda2:bandaworld recoon:recoon world:world-islands olive:teamolive flexi:flexihub; do
            target="${pair%%:*}"; site="${pair#*:}"
            if firebase hosting:sites:get "$site" --project "$PROJECT" >/dev/null 2>&1 \
               || firebase hosting:sites:create "$site" --project "$PROJECT" --non-interactive; then
              ONLY="$ONLY,hosting:$target"
            else
              echo "::warning::Could not create the $site site (the name may belong to another project)."
            fi
          done
          # A registered web app makes /__/firebase/init.json available for Google sign-in.
          if [ "$(firebase apps:list WEB --project "$PROJECT" --json | jq '.result | length')" = "0" ]; then
            firebase apps:create WEB "LearnKyrgyz" --project "$PROJECT"
          fi
          npm i --no-save google-auth-library@9 >/dev/null
          node scripts/firebase-auth-domains.mjs "$PROJECT"
          firebase use --add "$PROJECT" --alias default >/dev/null 2>&1 || true
          firebase target:clear hosting home --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting student --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting teacher --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting hub --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting oldhub --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting oldhub2 --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting banda --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting banda2 --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting recoon --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting world --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting olive --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:clear hosting flexi --project "$PROJECT" >/dev/null 2>&1 || true
          firebase target:apply hosting home learnkyrgyz --project "$PROJECT"
          firebase target:apply hosting student studentlrnkyrgyz --project "$PROJECT"
          firebase target:apply hosting teacher teachlrnkyrgyz --project "$PROJECT"
          case "$ONLY" in *hosting:hub*) firebase target:apply hosting hub the4workspace --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:oldhub,*|*hosting:oldhub) firebase target:apply hosting oldhub oneintwo --project "$PROJECT" ;; esac
          case "$ONLY" in *oldhub2*) firebase target:apply hosting oldhub2 oneinfour --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:banda,*|*hosting:banda) firebase target:apply hosting banda banda-worldislands --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:banda2*) firebase target:apply hosting banda2 bandaworld --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:recoon*) firebase target:apply hosting recoon recoon --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:world*) firebase target:apply hosting world world-islands --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:olive*) firebase target:apply hosting olive teamolive --project "$PROJECT" ;; esac
          case "$ONLY" in *hosting:flexi*) firebase target:apply hosting flexi flexihub --project "$PROJECT" ;; esac
          firebase deploy --only "$ONLY" --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
