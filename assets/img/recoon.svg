<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f8f"/><stop offset=".55" stop-color="#1b1f5e"/><stop offset="1" stop-color="#0c0f2e"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".8"><stop offset="0" stop-color="#7c8cff" stop-opacity=".55"/><stop offset=".6" stop-color="#7c8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf5"/><stop offset="1" stop-color="#b9c1d1"/></linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a3a"/><stop offset="1" stop-color="#11131c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e1b0"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <!-- ears -->
    <path d="M128 214 L150 104 Q156 86 172 96 L238 148 Z" fill="#9aa3b5"/>
    <path d="M384 214 L362 104 Q356 86 340 96 L274 148 Z" fill="#9aa3b5"/>
    <path d="M150 190 L162 122 L214 160 Z" fill="#1a1d2b"/>
    <path d="M362 190 L350 122 L298 160 Z" fill="#1a1d2b"/>
    <!-- head -->
    <path d="M256 128 C334 128 392 168 410 236 C420 274 404 312 372 344 L292 418 Q256 448 220 418 L140 344 C108 312 92 274 102 236 C120 168 178 128 256 128 Z" fill="url(#fur)"/>
    <!-- forehead stripe -->
    <path d="M256 140 C246 170 244 196 256 226 C268 196 266 170 256 140 Z" fill="#3a3f52" opacity=".85"/>
    <!-- mask -->
    <path d="M104 262 C128 222 176 212 216 236 C236 248 246 262 256 262 C266 262 276 248 296 236 C336 212 384 222 408 262 C390 300 352 316 316 304 C292 296 276 290 256 290 C236 290 220 296 196 304 C160 316 122 300 104 262 Z" fill="url(#mask)"/>
    <!-- eyes -->
    <circle cx="190" cy="262" r="22" fill="#fff"/><circle cx="194" cy="264" r="13" fill="#0c0f1c"/><circle cx="199" cy="258" r="5" fill="#fff"/>
    <circle cx="322" cy="262" r="22" fill="#fff"/><circle cx="318" cy="264" r="13" fill="#0c0f1c"/><circle cx="323" cy="258" r="5" fill="#fff"/>
    <!-- muzzle -->
    <path d="M206 318 C220 300 292 300 306 318 C320 338 300 380 256 392 C212 380 192 338 206 318 Z" fill="#ffffff"/>
    <path d="M232 324 Q256 312 280 324 Q276 346 256 350 Q236 346 232 324 Z" fill="#11131c"/>
    <path d="M256 350 L256 366 M240 372 Q256 382 272 372" stroke="#11131c" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- accent bar -->
  <rect x="176" y="440" width="160" height="12" rx="6" fill="url(#accent)"/>
</svg>
